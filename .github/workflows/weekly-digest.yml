name: Weekly literature digest

on:
  # Checks once an hour; the digest is only sent at the day and time set in settings.toml.
  schedule:
    - cron: "7 * * * *"
  # "Run workflow" button on the Actions tab: get a digest now.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no email, nothing saved). The preview is attached to the run."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-literature-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the digest
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 digest.py --scheduled
          elif [ "$DRY_RUN" = "true" ]; then
            python3 digest.py --dry-run
          else
            python3 digest.py
          fi

      - name: Attach the preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: preview.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Save what was sent
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state digests 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Weekly digest $(date -u +%Y-%m-%d)"
            git push
          fi
